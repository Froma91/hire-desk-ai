version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Retrieve the deployed API base URL from the CloudFormation stack
            # output named "ApiUrl" and expose it to the Vite build.
            - export VITE_API_BASE_URL=$(aws cloudformation describe-stacks --stack-name hire-desk-ai-mvp --region eu-west-1 --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
            # Fail fast if the ApiUrl output is missing, empty, or "None".
            - if [ -z "$VITE_API_BASE_URL" ] || [ "$VITE_API_BASE_URL" = "None" ]; then echo "ERROR: ApiUrl stack output is empty, missing, or None. Deploy the SAM stack 'hire-desk-ai-mvp' in eu-west-1 first."; exit 1; fi
            - echo "Building frontend against API base URL:$VITE_API_BASE_URL"
            - npm run build:amplify
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
